# ============================================================
# JWST Chain Orchestration Workflow
# ============================================================
#
# Browser-runnable workflow that orchestrates the full JWST
# demo chain across three pipeline repositories:
#
#   material-ingestion-pipeline  (upstream handoff)
#     -> content-research-pipeline  (downstream handoff)
#       -> media-generation-pipeline  (stable outputs)
#
# Trigger: manual via Actions tab (workflow_dispatch)
#
# Prerequisites:
#   Each pipeline repo must expose a reusable workflow with
#   a workflow_call trigger. See README.md for details.
# ============================================================

name: Run JWST Chain

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Demo topic for the JWST chain run"
        required: false
        default: "JWST: telescope architecture, star formation, and the early universe"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  # ----------------------------------------------------------
  # Stage 1: Material Ingestion
  # Produces: jwst-upstream-handoff artifact
  # ----------------------------------------------------------
  ingest:
    name: "Stage 1 – Material Ingestion"
    uses: siddhant61/material-ingestion-pipeline/.github/workflows/manual-validate-upstream.yml@main
    secrets: inherit

  # ----------------------------------------------------------
  # Stage 2: Content Research
  # Consumes: upstream handoff from Stage 1
  # Produces: jwst-downstream-handoff artifact
  # ----------------------------------------------------------
  research:
    name: "Stage 2 – Content Research"
    needs: ingest
    uses: siddhant61/content-research-pipeline/.github/workflows/manual-build-downstream.yml@master
    secrets: inherit

  # ----------------------------------------------------------
  # Stage 3: Media Generation
  # Consumes: downstream handoff from Stage 2
  # Produces: scene-plan-outputs artifact
  # ----------------------------------------------------------
  generate:
    name: "Stage 3 – Media Generation"
    needs: research
    uses: siddhant61/media-generation-pipeline/.github/workflows/manual-generate-sceneplan.yml@main
    secrets: inherit

  # ----------------------------------------------------------
  # Stage 4: Summary
  # Collects and reports on artifacts from all stages.
  # Runs even if earlier stages fail so the user always gets
  # a clear status report.
  # ----------------------------------------------------------
  summary:
    name: "Chain Summary"
    if: always()
    needs: [ingest, research, generate]
    runs-on: ubuntu-latest
    steps:
      # Reusable workflow jobs run within this workflow run,
      # so their uploaded artifacts are available here.
      - name: Download upstream handoff
        uses: actions/download-artifact@v4
        with:
          name: jwst-upstream-handoff
          path: artifacts/upstream-handoff
        continue-on-error: true

      - name: Download downstream handoff
        uses: actions/download-artifact@v4
        with:
          name: jwst-downstream-handoff
          path: artifacts/downstream-handoff
        continue-on-error: true

      - name: Download scene-plan outputs
        uses: actions/download-artifact@v4
        with:
          name: scene-plan-outputs
          path: artifacts/scene-plan-outputs
        continue-on-error: true

      - name: Print chain summary
        env:
          INGEST_RESULT: ${{ needs.ingest.result }}
          RESEARCH_RESULT: ${{ needs.research.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
        run: |
          # --- helper: map result to emoji ---
          status_icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⏹️" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          ICON_INGEST=$(status_icon "$INGEST_RESULT")
          ICON_RESEARCH=$(status_icon "$RESEARCH_RESULT")
          ICON_GENERATE=$(status_icon "$GENERATE_RESULT")

          # --- console output ---
          echo "============================================"
          echo "  JWST Chain Run – Summary"
          echo "============================================"
          echo ""
          echo "Topic: ${{ inputs.topic }}"
          echo ""
          echo "Stage results:"
          echo "  $ICON_INGEST  Stage 1 – Material Ingestion : $INGEST_RESULT"
          echo "  $ICON_RESEARCH  Stage 2 – Content Research   : $RESEARCH_RESULT"
          echo "  $ICON_GENERATE  Stage 3 – Media Generation   : $GENERATE_RESULT"
          echo ""
          echo "Artifacts:"
          echo "  jwst-upstream-handoff  : $([ -d artifacts/upstream-handoff ]  && echo 'PRESENT' || echo 'MISSING')"
          echo "  jwst-downstream-handoff: $([ -d artifacts/downstream-handoff ] && echo 'PRESENT' || echo 'MISSING')"
          echo "  scene-plan-outputs     : $([ -d artifacts/scene-plan-outputs ] && echo 'PRESENT' || echo 'MISSING')"
          echo ""
          echo "Download artifacts from the 'Artifacts' section at the bottom"
          echo "of this workflow run page."
          echo "============================================"

          # --- GitHub Actions Job Summary (renders in the UI) ---
          {
            echo "## JWST Chain Run – Summary"
            echo ""
            echo "**Topic:** ${{ inputs.topic }}"
            echo ""
            echo "### Stage results"
            echo ""
            echo "| Stage | Workflow | Result |"
            echo "|-------|---------|--------|"
            echo "| 1 – Material Ingestion | \`manual-validate-upstream.yml\` | $ICON_INGEST **$INGEST_RESULT** |"
            echo "| 2 – Content Research   | \`manual-build-downstream.yml\`  | $ICON_RESEARCH **$RESEARCH_RESULT** |"
            echo "| 3 – Media Generation   | \`manual-generate-sceneplan.yml\` | $ICON_GENERATE **$GENERATE_RESULT** |"
            echo ""
            echo "### Artifacts"
            echo ""
            echo "| Artifact name | Source stage | Status |"
            echo "|---------------|-------------|--------|"
            echo "| \`jwst-upstream-handoff\` | Stage 1 – Material Ingestion | $([ -d artifacts/upstream-handoff ] && echo '✅ Present' || echo '❌ Missing') |"
            echo "| \`jwst-downstream-handoff\` | Stage 2 – Content Research | $([ -d artifacts/downstream-handoff ] && echo '✅ Present' || echo '❌ Missing') |"
            echo "| \`scene-plan-outputs\` | Stage 3 – Media Generation | $([ -d artifacts/scene-plan-outputs ] && echo '✅ Present' || echo '❌ Missing') |"
            echo ""
            echo "> **Tip:** Download artifacts from the **Artifacts** section at the bottom of this workflow run page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any stage failed
        if: >-
          needs.ingest.result == 'failure' ||
          needs.research.result == 'failure' ||
          needs.generate.result == 'failure'
        run: |
          echo "One or more stages failed. See the summary above for details."
          exit 1
